    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Offline Resume" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Offline Resume",
      "url": "https://offlineresume.com/",
      "logo": "https://offlineresume.com/favicon.png",
      "description": "Privacy-first, browser-based resume and cover letter builder."
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Offline Resume",
      "url": "https://offlineresume.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://offlineresume.com/blog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Offline Resume",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://offlineresume.com/",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "description": "Free, private resume builder that runs entirely in your browser. No accounts, no cloud storage. Includes 14+ ATS-friendly templates, cover letter editor, PDF and JSON export."

</head>
